# Builds the Next.js frontend as static files and publishes it to GitHub Pages.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
#
# Optional repository variables (Settings → Secrets and variables → Actions →
# Variables). Without them the site is built from the content bundled in
# frontend/src/lib and the enquiry form does not send anything.
#   PMO_API_URL                     Laravel API used at build time, e.g. https://api.pmo.az/api/v1
#   NEXT_PUBLIC_API_URL             API the browser posts enquiries to (usually the same)
#   NEXT_PUBLIC_TURNSTILE_SITE_KEY  Cloudflare Turnstile site key for the enquiry form
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          # "/pmo.az" on <user>.github.io/pmo.az, empty with a custom domain.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PMO_API_URL: ${{ vars.PMO_API_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
